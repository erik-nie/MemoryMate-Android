name: Release

# Runs when you push a tag such as v2.0, or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track to publish to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        env:
          MM_KEYSTORE: ${{ runner.temp }}/upload.jks
          MM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --console=plain

      - name: Verify signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: memorymate-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eriknie.memorymate
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          whatsNewDirectory: distribution/whatsnew
          status: completed

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
